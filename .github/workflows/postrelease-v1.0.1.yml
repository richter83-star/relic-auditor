name: Finalize v1.0.1 Post-Release Record

on:
  push:
    branches:
      - postrelease/v1.0.1-record

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out post-release branch
        uses: actions/checkout@v4
        with:
          ref: postrelease/v1.0.1-record
          fetch-depth: 0

      - name: Update authoritative release record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          replacements = {
              "## Current release candidate: v1.0.1": "## Current release: v1.0.1",
              "The reconciliation history and validation rules are documented in [docs/v1.0.1-reconciliation.md](docs/v1.0.1-reconciliation.md). Release-candidate changes are summarized in [docs/v1.0.1-release-notes.md](docs/v1.0.1-release-notes.md), with upgrade guidance in [docs/v1.0.1-upgrade.md](docs/v1.0.1-upgrade.md).": "The reconciliation history and validation rules are documented in [docs/v1.0.1-reconciliation.md](docs/v1.0.1-reconciliation.md). Release changes are summarized in [docs/v1.0.1-release-notes.md](docs/v1.0.1-release-notes.md), with upgrade guidance in [docs/v1.0.1-upgrade.md](docs/v1.0.1-upgrade.md). The public release is available at [GitHub Release v1.0.1](https://github.com/richter83-star/relic-auditor/releases/tag/v1.0.1).",
              "The Windows RC bundles Python and does not require a separate Python installation on the target machine.": "The Windows installer bundles Python and does not require a separate Python installation on the target machine.",
              "The standalone `relic resurrect` command is the supported v1.0.1 RC interface.": "The standalone `relic resurrect` command is the supported v1.0.1 interface.",
              "An unsigned installer may be used as an internal RC test artifact, but it is **not eligible for automatic updater installation**. Production signing and a trusted stable manifest remain release-publication gates.": "The public v1.0.1 Windows installer is unsigned and therefore **not eligible for automatic updater installation**. Production signing and a trusted stable manifest remain automatic-update gates; manual installation is the supported v1.0.1 path.",
              "Current release-candidate evidence is recorded in [BUILD-STATUS.md](BUILD-STATUS.md). A green RC does not itself authorize a tag, GitHub Release, package-index upload, installer publication, or default-branch replacement.": "Release and publication evidence is recorded in [BUILD-STATUS.md](BUILD-STATUS.md) and [releases/v1.0.1/PUBLICATION.json](releases/v1.0.1/PUBLICATION.json). The `v1.0.1` tag and GitHub Release are tied to the exact validated release commit. The unsigned public installer remains manual-install only; the automatic updater stays fail-closed until trusted signing and stable-manifest infrastructure are provisioned."
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"README expected text missing: {old}")
              text = text.replace(old, new, 1)
          readme.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/reconcile-v1.yml")
          wf = workflow.read_text(encoding="utf-8")
          old_prefix = """name: Reconcile v1.0.1 Unified Validation\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - reconcile/v1.0.1-unified\n  pull_request:\n"""
          new_prefix = """name: Relic Auditor Validation\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - main\n  pull_request:\n    branches:\n      - main\n"""
          if old_prefix not in wf:
              raise SystemExit("expected reconciliation workflow trigger block missing")
          wf = wf.replace(old_prefix, new_prefix, 1)
          wf = wf.replace("Check out reconciliation branch", "Check out source", 1)
          wf = wf.replace("Upload verified v1.0.1 RC artifacts", "Upload verified v1.0.1 PR artifacts", 1)
          wf = wf.replace("name: Relic-Auditor-1.0.1-RC-Windows-x64", "name: Relic-Auditor-1.0.1-PR-Windows-x64", 1)
          workflow.write_text(wf, encoding="utf-8")
          PY

          cat > BUILD-STATUS.md <<'EOF'
          # Build status

          Relic Auditor v1.0.1 is the current public release. The repository's authoritative `main` line is the reconciled history containing the validated v0.12 production foundation plus the selectively ported Resurrection and Technical Truth work.

          ## Authoritative repository state

          - authoritative `main` cutover commit: `f78204b93c9b3279df14ea830dccf4247b29b44a`
          - preserved disconnected historical line: `archive/disconnected-main-v1.0.0` at `ee216fab38d4560acfdc6d2c9709a0635842f4df`
          - public release tag: `v1.0.1`
          - tag target / canonical release commit: `300d4efeb6747671ade474e51fed8e45b229c757`
          - canonical release tree: `05a2e8efc3aac86760f00cbdfbee4d6cf84c350c`
          - public release: https://github.com/richter83-star/relic-auditor/releases/tag/v1.0.1

          The cutover commit intentionally connects the previously disconnected histories while retaining the exact canonical v1.0.1 release tree. The tag remains on the exact commit whose source and Windows artifacts were validated.

          ## Release validation

          Canonical GitHub Actions run `32453647140` completed successfully on Windows Server 2025 / Python 3.12.

          It verified:

          - complete source test suite
          - unified CLI smoke
          - wheel and sdist construction
          - exact-commit frozen source archive and SHA-256 gate
          - frozen-source test suite
          - PyInstaller GUI and CLI builds
          - bundled audit / acquisition / Resurrection smoke
          - bundled GUI smoke
          - clean Windows install
          - installed audit / acquisition / Resurrection smoke
          - installed GUI smoke
          - user PATH registration
          - preservation of pre-existing Relic user configuration
          - in-place upgrade
          - stale GUI and CLI runtime cleanup
          - upgraded CLI version
          - silent uninstall
          - configuration preservation after uninstall
          - CLI PATH cleanup after uninstall
          - release manifest and checksum generation
          - artifact upload

          ## Canonical v1.0.1 artifacts

          - Actions artifact ID: `9436635474`
          - Actions artifact ZIP SHA-256: `267b3d59e7ec54391bf2a475e2a1c66f04046bd0be4842c9e07328594469083e`
          - frozen source SHA-256: `800e3bd250b81475542c150bcd89d537ad46dc26f8840a18ea071f500770af1b`
          - installer: `Relic-Auditor-Setup-1.0.1-x64.exe`
          - installer SHA-256: `56c3e20c9cdcf8e2a6beae76b0e05d928e1af0002e92240c83d1ace773069d10`
          - installer size: `73,928,624` bytes
          - Authenticode: `NotSigned`

          The GitHub Release contains the installer, frozen source ZIP, release manifest, SHA256SUMS, and installer README. The immutable publication record is stored in `releases/v1.0.1/PUBLICATION.json`.

          ## Security and update status

          The public v1.0.1 Windows installer is unsigned. Windows may therefore show an unknown-publisher warning. The automatic updater remains disabled and fail-closed for this release because the pinned Authenticode requirement is not satisfied.

          Automatic updates must not be enabled until all of the following are provisioned and validated:

          1. a trusted production Authenticode certificate;
          2. Actions signing credentials for the production certificate;
          3. a newly built and lifecycle-tested signed installer;
          4. a signed stable update manifest using the pinned update trust root; and
          5. permanent stable-manifest and installer hosting.

          ## Repository governance still external

          The connected GitHub automation does not expose repository ruleset / branch-protection administration. `main` should be protected in GitHub repository settings with required pull requests, required `source-validation` and `windows-installer-rc` checks, conversation resolution, and force-push / deletion blocking.

          The durable `.github/workflows/reconcile-v1.yml` workflow now validates pull requests targeting `main` and source changes pushed to `main`; its historical filename is retained to avoid an unnecessary workflow-file rename during the post-release record update.
          EOF

          cat > docs/v1.0.1-release-notes.md <<'EOF'
          # Relic Auditor 1.0.1

          v1.0.1 is the public reconciliation release that reunifies Relic Auditor's validated v0.12 production foundation with the later Resurrection and Technical Truth work that had developed on a disconnected repository history.

          Public release: https://github.com/richter83-star/relic-auditor/releases/tag/v1.0.1

          ## What changed

          - Restored one coherent lineage containing Build Packs, licensing, the Assisted Build Supervisor, updater/trust roots, provider health checks, desktop packaging, and later analysis improvements.
          - Added standalone `relic resurrect <target>` dispatch without replacing or weakening the existing v0.12 CLI command surface.
          - Ported deterministic Resurrection extraction and salvageability gating, including a forced `TOSS_IT` path for codebases without a substantive connected core.
          - Corrected Resurrection's configured-LLM integration to use the v0.12 provider contract with bounded input/output and timeouts.
          - Hardened LLM result validation, citation requirements, evidence-ID grounding, path/symbol grounding, confidence bounds, and secret redaction.
          - Replaced the old "real-time market" wording with an explicit offline heuristic market-context provider. v1.0.1 does not claim live market research.
          - Ported four Technical Truth correctness fixes: bare-raise stub detection, call-argument ordering, Next.js App Router reconstruction, and route-suffix collision hardening.
          - Promoted package, CLI, Windows resources, manifest, Inno Setup, source freezing, and installer lifecycle metadata coherently to 1.0.1.
          - Made the installer frozen-source version check CRLF/LF-safe after Windows validation exposed the earlier multiline-regex defect.
          - Reconciled the disconnected default-branch history without deleting either history. The prior line remains at `archive/disconnected-main-v1.0.0`.

          ## Preserved safety boundaries

          - Scanned targets are never imported, installed, executed, modified, moved, renamed, or deleted.
          - Build Packs copy only explicitly approved, hash-verified eligible assets into a separate managed destination.
          - Assisted Build actions are approval-gated and confined to managed workspaces and supported provider boundaries.
          - Secrets and prompt-like repository text are treated as untrusted data.
          - Optional LLM reasoning is bounded and advisory; deterministic evidence remains authoritative.
          - Update installation remains fail-closed unless manifest, hash/size, and Authenticode trust requirements are satisfied.

          ## Canonical release evidence

          - release commit: `300d4efeb6747671ade474e51fed8e45b229c757`
          - validation run: `32453647140` — success
          - frozen source SHA-256: `800e3bd250b81475542c150bcd89d537ad46dc26f8840a18ea071f500770af1b`
          - installer SHA-256: `56c3e20c9cdcf8e2a6beae76b0e05d928e1af0002e92240c83d1ace773069d10`
          - installer size: `73,928,624` bytes
          - Authenticode: `NotSigned`

          The exact public payload and publication workflow are recorded in `releases/v1.0.1/PUBLICATION.json`.

          ## Known limits

          - The public Windows installer is not Authenticode-signed. Windows may display an unknown-publisher warning.
          - Automatic updater installation remains blocked by design until trusted signing and a signed stable manifest are provisioned.
          - Production update/licensing trust material and permanent stable hosting remain external infrastructure tasks.
          - Market context is offline/static heuristic context, not live research.
          - `audit --resurrection` is not provided in v1.0.1; use `relic resurrect`.
          - Repository branch protection requires GitHub repository-admin configuration and is not exposed by the connected automation interface.
          EOF

          mkdir -p releases/v1.0.1
          cat > releases/v1.0.1/PUBLICATION.json <<'EOF'
          {
            "schema": "relic-auditor-publication-proof/v1",
            "release": "v1.0.1",
            "release_url": "https://github.com/richter83-star/relic-auditor/releases/tag/v1.0.1",
            "tag_target": "300d4efeb6747671ade474e51fed8e45b229c757",
            "validation_run": "32453647140",
            "validation_conclusion": "success",
            "artifact_id": "9436635474",
            "artifact_zip_sha256": "267b3d59e7ec54391bf2a475e2a1c66f04046bd0be4842c9e07328594469083e",
            "source_sha256": "800e3bd250b81475542c150bcd89d537ad46dc26f8840a18ea071f500770af1b",
            "installer_sha256": "56c3e20c9cdcf8e2a6beae76b0e05d928e1af0002e92240c83d1ace773069d10",
            "installer_size": 73928624,
            "authenticode": "NotSigned",
            "automatic_updater": "disabled_fail_closed_unsigned",
            "branch_protection": "requires_repository_admin_configuration",
            "publication_workflow_run": "32465393034",
            "publication_branch_head": "2e4cd261a7ded52aa6d51a754641eaabb7c992f5",
            "published_at": "2026-08-21T08:55:24Z",
            "assets": [
              "Relic-Auditor-Setup-1.0.1-x64.exe",
              "relic-auditor-1.0.1.zip",
              "release-manifest.json",
              "SHA256SUMS.txt",
              "INSTALLER-README.md"
            ]
          }
          EOF

      - name: Commit authoritative post-release record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/postrelease-v1.0.1.yml
          git add -- README.md BUILD-STATUS.md docs/v1.0.1-release-notes.md releases/v1.0.1/PUBLICATION.json .github/workflows/reconcile-v1.yml
          git diff --cached --check
          git commit -m "docs: record public v1.0.1 release and durable validation"
          git push origin HEAD:postrelease/v1.0.1-record
