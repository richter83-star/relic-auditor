name: Build Relic Auditor v1.0.2 Windows RC

on:
  workflow_dispatch:
  push:
    branches:
      - build/v1.0.2-focused-flow
    paths:
      - ".github/workflows/windows-installer.yml"
      - "installer/windows/**"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}

    steps:
      - name: Check out focused-flow branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: installer/windows/requirements-build.txt

      - name: Freeze exact v1.0.2 source from checked-out commit
        id: source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          $archive = "releases/relic-auditor-1.0.2.zip"
          git archive --format=zip --prefix=relic-auditor-1.0.2/ -o $archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Frozen source SHA-256: $hash"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare optional code-signing certificate
        id: signing
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_PFX_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP "relic-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            "certificate=$path" >> $env:GITHUB_OUTPUT
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "certificate=" >> $env:GITHUB_OUTPUT
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build and clean-test v1.0.2 installer
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            & "installer/windows/build-installer.ps1" `
              -SourceArchive "${{ steps.source.outputs.archive }}" `
              -ExpectedSourceSha256 "${{ steps.source.outputs.sha256 }}" `
              -OutputDirectory "release-output" `
              -SigningCertificate "${{ steps.signing.outputs.certificate }}" `
              -SigningPassword $env:WINDOWS_SIGNING_PFX_PASSWORD
          } else {
            & "installer/windows/build-installer.ps1" `
              -SourceArchive "${{ steps.source.outputs.archive }}" `
              -ExpectedSourceSha256 "${{ steps.source.outputs.sha256 }}" `
              -OutputDirectory "release-output"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "${{ steps.source.outputs.archive }}" -Destination "release-output/relic-auditor-1.0.2.zip" -Force

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ steps.signing.outputs.certificate }}" -Force -ErrorAction SilentlyContinue

      - name: Upload verified v1.0.2 RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Relic-Auditor-1.0.2-RC-Windows-x64
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
