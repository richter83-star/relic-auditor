name: Publish Relic Auditor v1.0.1

on:
  push:
    branches:
      - release/v1.0.1-publish

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.1
      TARGET_COMMIT: 300d4efeb6747671ade474e51fed8e45b229c757
      ARTIFACT_ID: "9436635474"
      ARTIFACT_ZIP_SHA256: 267b3d59e7ec54391bf2a475e2a1c66f04046bd0be4842c9e07328594469083e
      SOURCE_SHA256: 800e3bd250b81475542c150bcd89d537ad46dc26f8840a18ea071f500770af1b
      INSTALLER_SHA256: 56c3e20c9cdcf8e2a6beae76b0e05d928e1af0002e92240c83d1ace773069d10
      INSTALLER_SIZE: "73928624"

    steps:
      - name: Check out canonical release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify canonical validation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/32453647140")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$TARGET_COMMIT"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"

      - name: Download canonical RC artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > canonical-artifact.zip
          echo "${ARTIFACT_ZIP_SHA256}  canonical-artifact.zip" | sha256sum -c -
          rm -rf release-assets
          mkdir release-assets
          unzip -q canonical-artifact.zip -d release-assets

      - name: Verify exact release payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "INSTALLER-README.md"
            "Relic-Auditor-Setup-1.0.1-x64.exe"
            "SHA256SUMS.txt"
            "release-manifest.json"
            "relic-auditor-1.0.1.zip"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")

          echo "${SOURCE_SHA256}  release-assets/relic-auditor-1.0.1.zip" | sha256sum -c -
          echo "${INSTALLER_SHA256}  release-assets/Relic-Auditor-Setup-1.0.1-x64.exe" | sha256sum -c -
          test "$(stat -c '%s' release-assets/Relic-Auditor-Setup-1.0.1-x64.exe)" = "$INSTALLER_SIZE"
          grep -q 'NotSigned' release-assets/release-manifest.json

      - name: Prepare public release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE-NOTES-PUBLIC.md <<'EOF'
          # Relic Auditor v1.0.1

          Relic Auditor v1.0.1 is the unified release line built from the validated v0.12 production foundation plus the selectively ported Resurrection and Technical Truth work.

          ## Windows signing notice

          The Windows installer in this release is **not Authenticode-signed**. Its SHA-256 is published and verified, but Windows may show an unknown-publisher warning. Relic Auditor's automatic updater remains fail-closed and is **not enabled for this unsigned release**. Manual installation is the supported path until a trusted signing certificate and signed stable manifest are provisioned.

          ## Verification

          - Release commit: `300d4efeb6747671ade474e51fed8e45b229c757`
          - Validation run: `32453647140` (passed)
          - Frozen source SHA-256: `800e3bd250b81475542c150bcd89d537ad46dc26f8840a18ea071f500770af1b`
          - Windows installer SHA-256: `56c3e20c9cdcf8e2a6beae76b0e05d928e1af0002e92240c83d1ace773069d10`
          - Windows installer size: `73,928,624 bytes`
          - Authenticode: `NotSigned`

          EOF
          cat docs/v1.0.1-release-notes.md >> RELEASE-NOTES-PUBLIC.md

      - name: Create or verify exact v1.0.1 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > existing-tag.json 2>/dev/null; then
            existing="$(jq -r '.object.sha' existing-tag.json)"
            test "$existing" = "$TARGET_COMMIT"
            echo "Tag ${TAG} already exists at the correct commit."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${TARGET_COMMIT}"
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; verifying rather than overwriting."
          else
            gh release create "$TAG" \
              release-assets/Relic-Auditor-Setup-1.0.1-x64.exe \
              release-assets/relic-auditor-1.0.1.zip \
              release-assets/release-manifest.json \
              release-assets/SHA256SUMS.txt \
              release-assets/INSTALLER-README.md \
              --repo "$GITHUB_REPOSITORY" \
              --title "Relic Auditor v1.0.1" \
              --notes-file RELEASE-NOTES-PUBLIC.md \
              --verify-tag
          fi

      - name: Verify published Release and assets
        id: verify_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"

          expected=(
            "INSTALLER-README.md"
            "Relic-Auditor-Setup-1.0.1-x64.exe"
            "SHA256SUMS.txt"
            "release-manifest.json"
            "relic-auditor-1.0.1.zip"
          )
          mapfile -t actual < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")

          release_url="$(jq -r '.html_url' <<<"$release_json")"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$release_url"

      - name: Write publication proof to release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.verify_release.outputs.release_url }}
        shell: bash
        run: |
          set -euo pipefail
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          proof="$(jq -n \
            --arg schema 'relic-auditor-publication-proof/v1' \
            --arg release 'v1.0.1' \
            --arg release_url "$RELEASE_URL" \
            --arg tag_target "$TARGET_COMMIT" \
            --arg validation_run '32453647140' \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_zip_sha256 "$ARTIFACT_ZIP_SHA256" \
            --arg source_sha256 "$SOURCE_SHA256" \
            --arg installer_sha256 "$INSTALLER_SHA256" \
            --argjson installer_size "$INSTALLER_SIZE" \
            --arg publication_workflow_run "$GITHUB_RUN_ID" \
            --arg publication_branch_head "$GITHUB_SHA" \
            --arg published_at "$published_at" \
            '{
              schema: $schema,
              release: $release,
              release_url: $release_url,
              tag_target: $tag_target,
              validation_run: $validation_run,
              validation_conclusion: "success",
              artifact_id: $artifact_id,
              artifact_zip_sha256: $artifact_zip_sha256,
              source_sha256: $source_sha256,
              installer_sha256: $installer_sha256,
              installer_size: $installer_size,
              authenticode: "NotSigned",
              automatic_updater: "disabled_fail_closed_unsigned",
              branch_protection: "requires_repository_admin_configuration",
              publication_workflow_run: $publication_workflow_run,
              publication_branch_head: $publication_branch_head,
              published_at: $published_at,
              assets: [
                "Relic-Auditor-Setup-1.0.1-x64.exe",
                "relic-auditor-1.0.1.zip",
                "release-manifest.json",
                "SHA256SUMS.txt",
                "INSTALLER-README.md"
              ]
            }')"
          encoded="$(printf '%s\n' "$proof" | base64 -w0)"

          if gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/contents/releases/v1.0.1/PUBLICATION.json" \
              -f ref="release/v1.0.1-publish" > existing-proof.json 2>/dev/null; then
            current_sha="$(jq -r '.sha' existing-proof.json)"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/releases/v1.0.1/PUBLICATION.json" \
              -f message="release: refresh v1.0.1 publication proof" \
              -f content="$encoded" \
              -f branch="release/v1.0.1-publish" \
              -f sha="$current_sha" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/releases/v1.0.1/PUBLICATION.json" \
              -f message="release: record v1.0.1 publication proof" \
              -f content="$encoded" \
              -f branch="release/v1.0.1-publish" >/dev/null
          fi
