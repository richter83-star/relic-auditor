name: Sign Relic Auditor v1.0.3 Windows release candidate

run-name: Sign v1.0.3 from ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character current main commit to build and sign
        required: true
        type: string
      release_authorization:
        description: Explicit authorization for the managed signing request
        required: true
        type: choice
        options:
          - SIGN-v1.0.3

permissions:
  actions: read
  contents: read

jobs:
  sign-windows-installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      AUTHORIZED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_AUTHORIZATION: ${{ inputs.release_authorization }}
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out the authorized source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact current main commit
        shell: pwsh
        run: |
          $Expected = $env:AUTHORIZED_SOURCE_COMMIT.Trim().ToLowerInvariant()
          if ($Expected -notmatch '^[0-9a-f]{40}$') {
            throw "source_commit must be an exact 40-character commit SHA."
          }
          if ($env:RELEASE_AUTHORIZATION -ne "SIGN-v1.0.3") {
            throw "The release signing authorization was not confirmed."
          }
          if ($env:WORKFLOW_REF -ne "refs/heads/main") {
            throw "Managed release signing must be dispatched from the main workflow ref."
          }
          if ($env:WORKFLOW_SOURCE_COMMIT.ToLowerInvariant() -ne $Expected) {
            throw "The authorized commit must equal the main commit that triggered the workflow."
          }
          $Actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($Actual -ne $Expected) {
            throw "The checked-out commit does not match the authorized commit."
          }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve the current main branch." }
          $Main = (git rev-parse FETCH_HEAD).Trim().ToLowerInvariant()
          if ($Actual -ne $Main) {
            throw "Managed release signing is restricted to the exact current main commit."
          }

      - name: Require provisioned SignPath settings
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "SIGNPATH_API_TOKEN is not provisioned."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            throw "SIGNPATH_ORGANIZATION_ID is not provisioned."
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: installer/windows/requirements-build.txt

      - name: Freeze the authorized v1.0.3 source
        id: source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          $archive = "releases/relic-auditor-1.0.3.zip"
          git archive --format=zip --prefix=relic-auditor-1.0.3/ -o $archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and lifecycle-test the unsigned candidate
        shell: pwsh
        run: |
          & "installer/windows/build-installer.ps1" `
            -SourceArchive "${{ steps.source.outputs.archive }}" `
            -ExpectedSourceSha256 "${{ steps.source.outputs.sha256 }}" `
            -SourceCommit $env:AUTHORIZED_SOURCE_COMMIT `
            -OutputDirectory "release-output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "${{ steps.source.outputs.archive }}" `
            -Destination "release-output/relic-auditor-1.0.3.zip" -Force
          $manifest = Get-Content -LiteralPath "release-output/release-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.authenticode_status -ne "NotSigned") {
            throw "The managed provider must receive the lifecycle-tested unsigned candidate."
          }

      - name: Upload the unsigned installer to the trusted build record
        id: upload-unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Relic-Auditor-1.0.3-Unsigned-Windows-x64
          path: release-output/Relic-Auditor-Setup-1.0.3-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Submit the trusted artifact to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: relic-auditor
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-provider-output
          parameters: |
            version: "1.0.3"

      - name: Verify and finalize the signed release evidence
        shell: pwsh
        run: |
          & "installer/windows/finalize-signed-release.ps1" `
            -UnsignedReleaseDirectory "release-output" `
            -SignedArtifactDirectory "signed-provider-output" `
            -OutputDirectory "signed-release-output" `
            -ExpectedSourceCommit $env:AUTHORIZED_SOURCE_COMMIT `
            -ExpectedPublisher "Dracanus AI" `
            -SigningProvider "SignPath Foundation"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Relic-Auditor-1.0.3-Signed-RC-Windows-x64
          path: signed-release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
