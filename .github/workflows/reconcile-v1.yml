name: Reconcile v1.0.1 Unified Validation

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/v1.0.1-unified
  pull_request:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install test and package dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest build

      - name: Run complete source test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Smoke unified CLI
        shell: pwsh
        run: |
          relic --version
          relic resurrect --help
          relic build-pack --help
          relic build --help
          relic license --help

      - name: Build wheel and sdist
        shell: pwsh
        run: python -m build
