name: Relic Auditor Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install test and package dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest build

      - name: Run complete source test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Smoke unified CLI
        shell: pwsh
        run: |
          relic --version
          relic resurrect --help
          relic build-pack --help
          relic build --help
          relic license --help

      - name: Build wheel and sdist
        shell: pwsh
        run: python -m build

  windows-installer-rc:
    if: github.event_name == 'pull_request'
    needs: source-validation
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: installer/windows/requirements-build.txt

      - name: Freeze exact v1.0.3 PR-head source
        id: source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          $archive = "releases/relic-auditor-1.0.3.zip"
          git archive --format=zip --prefix=relic-auditor-1.0.3/ -o $archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "Frozen source SHA-256: $hash"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare optional code-signing certificate
        id: signing
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_PFX_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP "relic-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            "certificate=$path" >> $env:GITHUB_OUTPUT
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "certificate=" >> $env:GITHUB_OUTPUT
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build and lifecycle-test v1.0.3 installer
        shell: pwsh
        run: |
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            & "installer/windows/build-installer.ps1" `
              -SourceArchive "${{ steps.source.outputs.archive }}" `
              -ExpectedSourceSha256 "${{ steps.source.outputs.sha256 }}" `
              -SourceCommit "${{ github.event.pull_request.head.sha }}" `
              -OutputDirectory "release-output" `
              -SigningCertificate "${{ steps.signing.outputs.certificate }}" `
              -SigningPassword $env:WINDOWS_SIGNING_PFX_PASSWORD
          } else {
            & "installer/windows/build-installer.ps1" `
              -SourceArchive "${{ steps.source.outputs.archive }}" `
              -ExpectedSourceSha256 "${{ steps.source.outputs.sha256 }}" `
              -SourceCommit "${{ github.event.pull_request.head.sha }}" `
              -OutputDirectory "release-output"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "${{ steps.source.outputs.archive }}" -Destination "release-output/relic-auditor-1.0.3.zip" -Force

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ steps.signing.outputs.certificate }}" -Force -ErrorAction SilentlyContinue

      - name: Upload verified v1.0.3 PR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Relic-Auditor-1.0.3-PR-Windows-x64
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
